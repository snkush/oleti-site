<head>

<style>
:root{--ink:#07080a;--paper:#ede9e1;--red:#ff1a1a;--muted:rgba(237,233,225,.62);--line:rgba(237,233,225,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:'DM Mono',ui-monospace,monospace;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:-10%;background:radial-gradient(ellipse at 50% 0%,#1a0b0b 0%,#07080a 70%);filter:blur(60px) brightness(.35) saturate(1.2);transform:scale(1.1);z-index:0}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,10,.35),rgba(7,8,10,.85))}
main{position:relative;z-index:1;width:100%;max-width:420px;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.14em;color:var(--paper);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:7px;height:7px;background:var(--red);border-radius:50%;display:inline-block}
.tag{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cover{width:100%;height:auto;max-height:70vh;object-fit:contain;display:block;box-shadow:0 30px 60px rgba(0,0,0,.55);background:#111}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.05;letter-spacing:.01em;text-align:center;margin-top:24px}
.artist{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.btns{width:100%;margin-top:28px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.btn{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:14px;padding:16px 8px;border-bottom:1px solid var(--line);color:var(--paper);text-decoration:none;transition:background .2s,padding .2s}
.btn .ic{color:var(--muted);transition:color .2s}
.btn .ic svg{width:22px;height:22px;display:block}
.lb{font-size:14px;letter-spacing:.06em}
.lb em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sb{font-size:10px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(237,233,225,.35);padding:7px 11px;color:var(--paper);background:transparent;transition:background .2s,color .2s,border-color .2s}
.btn.kl{background:rgba(237,233,225,.045)}
.btn.kl .sb{border-color:var(--paper)}
.btn:hover,.btn:focus-visible{background:rgba(237,233,225,.07);padding-left:14px;outline:none}
.btn:hover .ic,.btn:focus-visible .ic{color:var(--paper)}
.btn:hover .sb,.btn:focus-visible .sb{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.more{margin-top:18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.more:hover{color:var(--paper)}
footer{margin-top:36px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:2}
footer a{color:var(--paper);text-decoration:none}
footer a:hover{color:var(--red)}
.drops{margin-top:44px;padding:24px;border:1px solid var(--line);max-width:520px}
.drops-t{font-family:var(--d);font-size:20px;letter-spacing:.02em;margin-bottom:8px}
.drops-s{font-size:12px;line-height:1.7;color:var(--muted);margin-bottom:16px}
.drops form{display:flex;gap:8px;flex-wrap:wrap}
.drops input[type=email]{flex:1 1 200px;min-width:0;background:transparent;border:1px solid rgba(237,233,225,.35);color:var(--paper);padding:12px 14px;font:inherit;font-size:13px;border-radius:0}
.drops input[type=email]:focus{outline:none;border-color:var(--paper)}
.drops button{background:var(--paper);color:var(--ink);border:1px solid var(--paper);padding:12px 20px;font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.drops button:hover{background:transparent;color:var(--paper)}
.drops small{display:block;margin-top:12px;font-size:10px;line-height:1.6;color:rgba(237,233,225,.6)}
.drops .ok{display:none;margin-top:12px;font-size:12px;color:var(--paper)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <div class="top">
    <a class="logo" href="https://snk-records.com/"><i></i>SNK RECORDS</a>
    <a class="tag" href="https://snk-records.com/sorties" style="text-decoration:none">Toutes les sorties</a>
  </div>
  
  <h1>LOVE</h1>
  <p class="artist">OLETI</p>
  <nav class="btns" aria-label="Plateformes d'écoute">
      <a class="btn" href="https://music.apple.com/fr/album/love-single/1791311592" target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.6 3.2 9.4 4.9a1 1 0 0 0-.8 1v9.6a3 3 0 1 0 1.6 2.6V9.3l7-1.4v5.6a3 3 0 1 0 1.6 2.6V4.2a1 1 0 0 0-1.2-1Z"/></svg></span><span class="lb">Apple Music</span><span class="sb">Écouter</span></a>
  </nav>
  <div style="width:100%;margin-top:32px"><div class="drops gh">
    <p class="drops-t">Accès en avant-première aux drops</p>
    <p class="drops-s">Nouveaux sons, exclus Kloud, clips : suis Oleti pour les recevoir en premier.</p>
    
    
    
  </div></div>
  <footer>
    Label indépendant &amp; studio · Marseille<br>
    <a href="https://snk-records.com/">snk-records.com</a>
  </footer>
</main>
<script>
document.querySelectorAll('.dropsForm').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();var b=f.querySelector('button');b.disabled=true;
fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f)).toString()})
.then(function(r){if(!r.ok)throw 0;f.style.display='none';f.parentNode.querySelector('.ok').style.display='block'})
.catch(function(){b.disabled=false;alert("Erreur d'envoi, réessaie ou écris à lelabelsnk@gmail.com")})})});
</script>
</body>
</html>
